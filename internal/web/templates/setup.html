{{define "content"}}
<h1>Set up your workspace</h1>
<p class="muted">This runs once. It creates the owner account, then locks itself.</p>
<form method="post" action="/setup" class="stack">
  <div class="field"><label for="workspace">Workspace name</label><input id="workspace" name="workspace" required maxlength="120" value="{{.Form.workspace}}" placeholder="Your studio or agency name"></div>
  <div class="field"><label for="name">Your name</label><input id="name" name="name" required maxlength="120" value="{{.Form.name}}"></div>
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required maxlength="254" autocomplete="username" value="{{.Form.email}}"></div>
  <div class="field"><label for="password">Password <span class="hint">12 to 200 characters, not a common password</span></label><input id="password" name="password" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></div>
  <div class="form-actions"><button type="submit" class="-primary">Create owner account</button></div>
</form>
{{end}}
