{{define "title"}}Log in{{end}}
{{define "content"}}
<h1>Log in</h1>
<form method="post" action="/login">
  <p><label for="email">Email</label><br><input id="email" name="email" type="email" required autocomplete="username" value="{{.Form.email}}"></p>
  <p><label for="password">Password</label><br><input id="password" name="password" type="password" required autocomplete="current-password"></p>
  <button type="submit">Log in</button>
</form>
{{end}}
