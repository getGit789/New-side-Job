{{define "content"}}
<h1>Reset password</h1>
{{if not .Message}}
<p class="muted">Enter your email. If it belongs to an account, a one-hour, single-use link is sent.</p>
<form method="post" action="/password/forgot" class="stack">
  <div class="field"><label for="email">Email</label><input id="email" name="email" type="email" required autocomplete="username"></div>
  <div class="form-actions"><button type="submit" class="-primary">Send reset link</button></div>
</form>
{{end}}
<p><a href="/login">Back to log in</a></p>
{{end}}
