{{define "content"}}
<div class="page"><div><h1>Account</h1><ul class="meta"><li><strong>{{.User.Name}}</strong></li><li>{{.User.Email}}</li><li>{{human .User.Role}}</li></ul></div></div>
<section class="block"><h2>Email notifications</h2>
<div class="card">
<form method="post" action="/account/notifications">
  <div class="field -wide"><label class="check"><input type="checkbox" name="email_notifications" value="1" {{if .Data.EmailNotifications}}checked{{end}}> <span>Send me an email when something needs my attention <span class="hint">Notifications inside the portal are always on.</span></span></label></div>
  <div class="form-actions"><button type="submit">Save</button></div>
</form>
</div></section>
{{if .Demo}}
<section class="block"><h2>Password and email</h2><div class="card"><p>Passwords and emails cannot be changed in the demo.</p></div></section>
{{else}}
<section class="block"><h2>Change password</h2>
<div class="card">
<form method="post" action="/account/password">
  <div class="field"><label for="current">Current password</label><input id="current" name="current" type="password" required autocomplete="current-password"></div>
  <div class="field"><label for="password">New password <span class="hint">12 to 200 characters, not a common password</span></label><input id="password" name="password" type="password" required minlength="12" maxlength="200" autocomplete="new-password"></div>
  <div class="form-actions"><button type="submit">Change password</button> <small>Other devices are logged out.</small></div>
</form>
</div></section>
<section class="block"><h2>Change email</h2>
<div class="card">
<form method="post" action="/account/email">
  <div class="field"><label for="ecurrent">Current password</label><input id="ecurrent" name="current" type="password" required autocomplete="current-password"></div>
  <div class="field"><label for="email">New email</label><input id="email" name="email" type="email" required maxlength="254" value="{{.User.Email}}"></div>
  <div class="form-actions"><button type="submit">Change email</button></div>
</form>
</div></section>
{{end}}
{{end}}
