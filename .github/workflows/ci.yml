name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with: { go-version-file: go.mod }
      - run: make lint
      - run: make test
      - run: make build
      - run: ./dist/briefrelay check
        env: { BRIEFRELAY_ENV: development }
      - run: make package-test
      - uses: actions/upload-artifact@v4
        with: { name: release, path: "dist/*.tar.gz\ndist/SHA256SUMS\ndist/sbom.json\ndist/THIRD_PARTY_LICENSES.txt" }
